<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayane Birthday Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- THIỆP -->
    <div class="card" id="card">

        <!-- BÌA -->
        <div class="cover" id="cover">
            <div class="cover-content">
                <div class="small">for Ayane</div>
                <h1>🎂 Happy Birthday</h1>
                <p>クリックして開いてね 💙</p>
            </div>
        </div>

        <!-- MẶT TRONG -->
        <div class="inside">

            <!-- Nền thiệp biển -->
            <img src="./ocean-card.png" class="paper" alt="Ocean Card">

            <!-- Nội dung -->
            <div class="letter">

                <!-- Miku -->
                <img src="./miku.png" class="miku" alt="Miku">

                <h2>あやね、お誕生日おめでとう！</h2>

                <p class="message">
                    今日はあやねにとって特別な日 🌊<br>
                    たくさん笑って、幸せいっぱいの一年になりますように ✨💙<br><br>
                    いつもありがとう。<br>
                    これからも素敵な思い出をたくさん作ってね 🐬
                </p>
            </div>

            <!-- Nút đóng -->
            <button id="closeBtn">閉じる</button>
        </div>
    </div>

    <!-- ÂM THANH -->
    <audio id="bgm" src="./birthday.mp3" preload="auto" loop></audio>

    <!-- JAVASCRIPT -->
    <script>
        const card = document.getElementById('card');
        const cover = document.getElementById('cover');
        const closeBtn = document.getElementById('closeBtn');
        const bgm = document.getElementById('bgm');

        // Mở thiệp
        cover.addEventListener('click', async () => {
            if (!card.classList.contains('open')) {
                card.classList.add('open');

                try {
                    bgm.currentTime = 0;
                    bgm.volume = 0.6;
                    await bgm.play();
                } catch (e) {
                    console.error('Không phát được nhạc:', e);
                }
            }
        });

        // Đóng thiệp
        closeBtn.addEventListener('click', () => {
            card.classList.remove('open');
            bgm.pause();
            bgm.currentTime = 0;
        });
    </script>

</body>
</html>
